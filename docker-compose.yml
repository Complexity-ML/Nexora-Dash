x-lake-environment: &lake-environment
  SAM_DATA_SOURCE: ${SAM_DATA_SOURCE:-mock}
  COLLECTION_ENABLED: ${COLLECTION_ENABLED:-false}
  COLLECTION_SOURCE: ${COLLECTION_SOURCE:-digimon}
  COLLECTION_SCOPE: ${COLLECTION_SCOPE:-group}
  COLLECTION_MINIMUM_RETAINED_FRACTION: ${COLLECTION_MINIMUM_RETAINED_FRACTION:-0.9}
  DATABASE_URL: postgresql://sam:${POSTGRES_PASSWORD}@postgres:5432/sam
  BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Europe/Paris}
  S3_ENDPOINT_URL: http://minio:9000
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
  S3_BUCKET: sam-data
  SPARK_MASTER: local[*]
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sam
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: sam
    volumes: [sam-postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U sam -d sam]
      interval: 3s
      timeout: 3s
      retries: 20
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']
    volumes: [sam-minio:/data]
    healthcheck:
      test: [CMD, mc, ready, local]
      interval: 5s
      timeout: 3s
      retries: 20
  dash:
    build: ./nexora
    image: nexora-dash:local
    environment:
      <<: *lake-environment
      DEMO_ACCOUNTS_ENABLED: ${DEMO_ACCOUNTS_ENABLED:-true}
      DEMO_TOOLS_ENABLED: ${DEMO_TOOLS_ENABLED:-false}
      SAM_DEMO_PASSWORD: ${SAM_DEMO_PASSWORD}
      DASH_COOKIE_SECURE: ${DASH_COOKIE_SECURE:-false}
      DASH_SECRET_FILE: /var/lib/nexora/session.key
    volumes: [dash-session:/var/lib/nexora]
    ports: ['127.0.0.1:${DASH_PORT:-8050}:8050']
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8050/_dash-layout', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 20
    depends_on:
      minio: {condition: service_healthy}
      postgres: {condition: service_healthy}
  recovery-worker:
    profiles: [recovery]
    build: ./nexora
    image: nexora-dash:local
    environment: *lake-environment
    command: [python, -m, scripts.recover_collections, --watch, --limit, '10', --interval, '300', --max-interval, '3600']
    init: true
    restart: on-failure:5
    stop_grace_period: 5m
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_healthy}
volumes:
  sam-minio:
  sam-postgres:
  dash-session:
