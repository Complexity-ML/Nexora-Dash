name: Application checks
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    env:
      SPARK_LOCAL_IP: 127.0.0.1
      PYSPARK_PYTHON: python
    defaults:
      run:
        working-directory: nexora
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            nexora/requirements.txt
            nexora/requirements-dev.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: python ../workflow/ci-postgres.py
      - run: pip install -r requirements-dev.txt
      - run: alembic upgrade head
      - run: pytest -q
  production-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target production -t nexora-runtime nexora
      - name: Check production boundary and CLI
        run: |
          docker run --rm --network none nexora-runtime python -c "from pathlib import Path; from importlib.util import find_spec; assert not any(Path('/app', name).exists() for name in ('devtools','scripts','tests')); assert find_spec('pytest') is None"
          docker run --rm --network none nexora-runtime nexora --help
          docker run --rm --network none nexora-runtime nexora collect run --help
